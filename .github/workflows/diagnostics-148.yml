name: Release 148 status (manual, read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read verified release run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, os
          url='https://api.github.com/repos/Bugaga31/vless-card-vpn/actions/runs/39602335580'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          print('Release run:',data['status'],data['conclusion'],'attempt',data['run_attempt'])
          print('Commit:',data['head_sha'])
          PY
