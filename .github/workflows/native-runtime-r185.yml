name: Native Hello laboratory runtime validation r185
on:
  push:
    branches: ['experiment/validation-r185-lab-device']
    paths-ignore: ['docs/validation/**']
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Build instrumented debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare authenticated loopback backend
        run: |
          curl -fL --retry 2 -o backend.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  backend.tar.gz' | sha256sum -c -
          tar xzf backend.tar.gz
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run controlled native Android checks
        id: native
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/ci/run-runtime-r185.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-runtime-r185
          path: |
            docs/validation/r185-device.json
            runtime-results-r185.txt
            runtime-r185.log
            fixture-r185.log
            runtime-r185.png
      - name: Publish actual controlled runtime result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', NATIVE_OUTCOME: '${{ steps.native.outcome }}'}
        run: |
          set -euo pipefail
          if ! test -f docs/validation/r185-device.json; then
            mkdir -p docs/validation
            python3 -c 'import os,json;json.dump({"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"native_outcome":os.environ["NATIVE_OUTCOME"],"runtime_tests_executed":False},open("docs/validation/r185-device.json","w"))'
          fi
          test "$GITHUB_REF" = refs/heads/experiment/validation-r185-lab-device
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/r185-device.json
          git commit -m 'docs: record controlled Android checks [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/experiment/validation-r185-lab-device
      - name: Require runtime assertions
        if: always()
        run: python3 -c 'import json;d=json.load(open("docs/validation/r185-device.json"));assert d.get("passed") is True,d'
