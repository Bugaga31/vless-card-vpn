name: Read release 149 status
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read current release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Bugaga31/vless-card-vpn/actions/runs/39616599655 --jq '{id,status,conclusion,head_sha}'
