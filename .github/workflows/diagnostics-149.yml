name: Pause release 149 for revised requirements
on:
  push:
    branches: [diagnostics-149]
permissions:
  contents: read
  actions: write
jobs:
  pause-release:
    runs-on: ubuntu-latest
    steps:
      - name: Stop only the unpublished candidate requested for revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=Bugaga31/vless-card-vpn
          RUN=39616599655
          SHA=$(gh api repos/$REPO/actions/runs/$RUN --jq .head_sha)
          test "$SHA" = 4efdb14e1bbd7c5c6a34de7f9b2d637994b1ca2e
          STATUS=$(gh api repos/$REPO/actions/runs/$RUN --jq .status)
          if [ "$STATUS" != completed ]; then gh api -X POST repos/$REPO/actions/runs/$RUN/cancel; fi
          gh api repos/$REPO/actions/runs/$RUN --jq '{id,status,conclusion,head_sha}'
