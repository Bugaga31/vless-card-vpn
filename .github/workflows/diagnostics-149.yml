name: Cancel superseded 149 candidate
on:
  push:
    branches: [diagnostics-149]
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the obsolete release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=Bugaga31/vless-card-vpn
          RUN=39616365136
          SHA=$(gh api repos/$REPO/actions/runs/$RUN --jq .head_sha)
          test "$SHA" = ca0005bc29583cec6dfbc41d32b53cfd749c17f9
          STATUS=$(gh api repos/$REPO/actions/runs/$RUN --jq .status)
          if [ "$STATUS" != completed ]; then gh api -X POST repos/$REPO/actions/runs/$RUN/cancel; fi
          echo 'Superseded candidate cancelled; latest release gates remain mandatory.'
