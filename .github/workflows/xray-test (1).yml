name: Xray Test Release
on:
  push:
    branches: [feat/xray-test]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-test-release
  cancel-in-progress: false
jobs:
  xray-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Prepare license assets and native sources
        env:
          GOTOOLCHAIN: local
        run: python3 xray-test/release/prepare.py prepare
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7
      - run: chmod +x gradlew
      - name: Compile and run unit tests
        run: ./gradlew :xray-test:testDebugUnitTest :xray-test:assembleDebug --stacktrace
      - name: Package APK and source kit
        run: |
          python3 xray-test/release/prepare.py bundle
          cp xray-test/build/outputs/apk/debug/xray-test-debug.apk release/VLESS-Card-Test-Xray.apk
          cd release
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-test-unit-results
          path: xray-test/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Publish experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xray-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 'VLESS Card Test — Xray #${{ github.run_number }}'
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: xray-test/release/RELEASE_NOTES.md
          files: |
            release/VLESS-Card-Test-Xray.apk
            release/VLESS-Card-Test-Xray-sources.zip
            release/SHA256SUMS.txt
