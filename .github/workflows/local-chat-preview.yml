name: Equilibrium Local Chat Preview (experimental, signed)
on:
  push:
    branches: ['feat/equilibrium-local-chat-169']
env:
  VERSION: beta-build-169
permissions:
  contents: read
concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/feat/equilibrium-local-chat-169'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Restore native libraries (validated before use)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: JVM tests and release build
        run: |
          N=${VERSION#beta-build-}; export GITHUB_RUN_NUMBER=${N#release-build-}
          chmod +x gradlew
          python3 -m unittest discover -s tools/release-gates -p 'test_*.py'
          bash tools/test-security-result-parser.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_cloud_*.py'
          ./gradlew -PbetaPreview=true -PemulatorAbis=true -PsplitAbi=true --no-daemon --max-workers=2 :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :security-test-probe:assembleDebug
      - name: Sign with persistent Beta key (v1+v2+v3)
        env:
          KS_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
          KSP: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f beta.jks aligned.apk release/*.idsig' EXIT INT TERM
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "$KS_B64" | base64 -d > beta.jks
          mkdir -p release
          cp security-test-probe/build/outputs/apk/debug/security-test-probe-debug.apk release/security-test-probe.apk
          OUT=app/build/outputs/apk/release
          sign() {
            $BT/zipalign -f -p 4 "$1" aligned.apk
            $BT/apksigner sign --ks beta.jks --ks-key-alias beta --ks-pass env:KSP --key-pass env:KSP \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 21 --out "$2" aligned.apk
            $BT/apksigner verify --min-sdk-version 21 "$2"
          }
          # Universal APK keeps the old file name (emulator check and existing download links).
          sign $OUT/app-universal-release-unsigned.apk release/VLESS-Card-Beta.apk
          # arm64-only: about half the download, for almost all modern phones.
          sign $OUT/app-arm64-v8a-release-unsigned.apk release/VLESS-Card-Beta-arm64.apk
          rm -f beta.jks aligned.apk release/*.idsig
          ls -l release/*.apk
          $BT/apksigner verify -v --min-sdk-version 21 release/VLESS-Card-Beta.apk | tee verify.txt
          grep -q "v1 scheme (JAR signing): true" verify.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" verify.txt
          $BT/zipalign -c -p 4 release/VLESS-Card-Beta.apk
          $BT/aapt2 dump badging release/VLESS-Card-Beta.apk | grep -E "^package|application-label:|native-code"
          unzip -tq release/VLESS-Card-Beta.apk
          # Same signed universal APK used by launch gates must include native emulator libraries.
          for lib in libgojni.so libhev-socks5-tunnel.so; do
            unzip -l release/VLESS-Card-Beta.apk | grep -q "lib/x86_64/$lib"
          done
          $BT/apksigner verify --print-certs -v release/VLESS-Card-Beta.apk | grep -E "key size|SHA-256 digest"
          $BT/apksigner verify --print-certs -v release/VLESS-Card-Beta.apk | grep -q "key size (bits): 2048"
          unzip -l release/VLESS-Card-Beta.apk | grep -E "META-INF/.*\.(RSA|SF)$"
          for abi in arm64-v8a x86_64; do
            unzip -l release/VLESS-Card-Beta.apk | grep -q "lib/$abi/libequilibrium_ai.so"
          done
          cp docs/local-ai-host-smoke-169.json release/local-ai-host-smoke.json
          python3 tools/release-gates/verify_candidate.py
          python3 - <<'PY'
          import json
          d=json.load(open('release/verification.json'))['jvm']
          open('release/tests.txt','w').write(f"{d['tests']} {d['failures'] + d['errors']}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-apk
          path: release/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require completed release scope
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('tools/release-gates/local-chat-readiness.json'))
          if d.get('ready') is not True:
              raise SystemExit('Publication held: requested improvements are not complete')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-apk
          path: release
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${VERSION#beta-build-}; V=${V#release-build-}; D=$V
          if [ "$V" -gt 110 ] 2>/dev/null; then V="2.$((V-111))"; elif [ "$V" -gt 100 ] 2>/dev/null; then V="1.$((V-101))"; else V="0.$V"; fi
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
          test "$CURRENT" = "$GITHUB_SHA" || { echo 'Release branch moved; refusing publication'; exit 1; }
          cd release
          mv VLESS-Card-Beta.apk VLESS-Card-Beta-1.$V.apk
          mv VLESS-Card-Beta-arm64.apk VLESS-Card-Beta-1.$V-arm64.apk
          python3 - "$V" <<'PY'
          import json, sys
          p='verification.json'; d=json.load(open(p)); v=sys.argv[1]
          for a in d['apks']:
              a['file']=a['file'].replace('VLESS-Card-Beta', 'VLESS-Card-Beta-1.'+v)
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          sha256sum VLESS-Card-Beta-1.$V.apk VLESS-Card-Beta-1.$V-arm64.apk > SHA256SUMS-Beta.txt
          read T F < tests.txt || true
          NOTES=../docs/release-1.$V.md; [ -f "$NOTES" ] || NOTES=../docs/release-1.0.$D.md; [ -f "$NOTES" ] || NOTES=../docs/beta-1.0.$D.md
          if [ ! -f "$NOTES" ]; then
            NOTES=../docs/archive/releases/release-1.$V.md
            [ -f "$NOTES" ] || NOTES=../docs/archive/releases/beta-1.0.$D.md
          fi
          [ -f "$NOTES" ] || NOTES=/dev/null
          { cat "$NOTES"; echo; echo "### Проверки этой сборки"; echo "- JVM-тесты: $T, ошибок: $F"; echo "- Подписи v1/v2/v3, постоянный сертификат Beta; идентификатор пакета и версия проверены"; echo "- Полная Android E2E-матрица и проверки установки на эмуляторах для этого экспериментального выпуска НЕ запускались по разрешению владельца"; echo "- На физическом телефоне и реальных сетях не проверено"; } > notes.md
          test "$VERSION" = 'beta-build-169'
          gh release create "beta-v1.$V" VLESS-Card-Beta-1.$V.apk VLESS-Card-Beta-1.$V-arm64.apk SHA256SUMS-Beta.txt verification.json local-ai-host-smoke.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Equilibrium 1.$V · Local AI Preview" --notes-file notes.md
