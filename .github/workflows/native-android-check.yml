name: Android native route checks
on:
  push:
    branches: [fix/android-stability-stable-tls-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build and JVM regression tests
        env:
          GITHUB_RUN_NUMBER: '50'
        run: |
          chmod +x gradlew
          ./gradlew -PstabilityPreview=true --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare controlled VLESS backend
        run: |
          curl -fL --retry 2 -o backend.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  backend.tar.gz' | sha256sum -c -
          tar xzf backend.tar.gz
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute JNI, Room and controlled outbound checks
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run-native-android-check.sh
      - name: Upload diagnostics, not a release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-api-${{ matrix.api }}
          path: |
            native-results.txt
            fixture.log
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
