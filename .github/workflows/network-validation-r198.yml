name: Same-path observation commit and optional-work policy r198
on:
  push:
    branches: ['integration/network-r198']
    paths-ignore: ['docs/validation/**']
permissions:
  contents: read
concurrency:
  group: auto-validation-r198
  cancel-in-progress: true
jobs:
  jvm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Apply reviewed compact source patch
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          base64 -d tools/patches/network-r198.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/network-r198.patch"
          echo '6a91532ab83e5324ba9fb65aef1b5b792f6989116caa613dbd9f99753b86f1d5  '"$RUNNER_TEMP/network-r198.patch" | sha256sum -c -
          git fetch --quiet --no-tags origin 0fe8abd672580077b3ad431dbafda798bb11dbfa
          git restore --source 0fe8abd672580077b3ad431dbafda798bb11dbfa -- app/src/main app/src/test
          PATCH="$RUNNER_TEMP/network-r198.patch"
          if git apply --reverse --check "$PATCH" 2>/dev/null; then
            echo 'Source patch already applied'
          else
            git apply --check "$PATCH"
            git apply "$PATCH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app
            git commit -m 'fix(auto): bound search and account for started probes [skip ci]'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/network-r198
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Python and native loopback regressions
        id: host
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s tools/e2e -p 'test_*.py'
          python3 -m unittest discover -s tools/release-gates -p 'test_*.py'
          bash tools/run-byedpi-host-check.sh
      - name: Execute debug and release JVM tests
        id: jvm
        continue-on-error: true
        env: {GITHUB_RUN_NUMBER: '198'}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --continue --no-daemon --max-workers=2 :app:testDebugUnitTest :app:testReleaseUnitTest :vpn-test-probe:testDebugUnitTest 2>&1 | tee /tmp/jvm-r198.log
      - name: Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Summarize actual test results
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: python3 tools/ci/summarize-r198.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-r198
          path: |
            docs/validation/r198-jvm.json
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Publish scoped validation report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/network-r198
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/r198-jvm.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record executed r198 regression results [skip ci]'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/network-r198
          fi
      - name: Require passing checks
        if: always()
        run: python3 -c 'import json; d=json.load(open("docs/validation/r198-jvm.json")); assert all(v=="success" for v in d["steps"].values()), d["steps"]; assert not d["failures"] and not d["lint_errors"] and len(d["suites"])>=260; target=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.ObservationR198Test"]; assert len(target)==2 and all(int(s["tests"])==48 and int(s["failures"])==0 and int(s["errors"])==0 and int(s["skipped"])==0 for s in target), target'
