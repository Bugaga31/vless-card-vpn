name: Diagnose fixed API33 failure (read-only)
on:
  push:
    branches: ['diagnose/auto-deferred-fallback-149']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/diagnose/auto-deferred-fallback-149'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the approved source job and redact failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, re, subprocess
          PREFIX = 'repos/Bugaga31/vless-card-vpn/'
          RUN, JOB = 39654604838, 119411438783
          SHA = '386c1ac71b24f5e837c68efb93aeb82d66d11808'
          def api(path):
              result = subprocess.run(['gh', 'api', PREFIX + path], stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, timeout=90)
              if result.returncode:
                  denied = bool(re.search(rb'403|401|forbidden|not accessible|admin rights', result.stderr, re.I))
                  message = 'ACCESS_DENIED: stop; owner must download the source log' if denied else 'Source API read failed; stop without retry'
                  print('::error title=Diagnostic stopped::' + message)
                  raise SystemExit(1)
              return result.stdout
          source = json.loads(api(f'actions/runs/{RUN}'))
          job = json.loads(api(f'actions/jobs/{JOB}'))
          if (source['id'] != RUN or source['head_sha'] != SHA or job['id'] != JOB
                  or job['run_id'] != RUN or job['conclusion'] != 'failure'):
              raise SystemExit('Source identity mismatch; stop')
          failed = [step for step in job['steps'] if step['conclusion'] == 'failure']
          if len(failed) != 1:
              raise SystemExit('Unexpected failed-step count; stop')
          step = failed[0]
          def instant(value):
              return dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
          start = instant(step['started_at']) - dt.timedelta(seconds=2)
          end = instant(step['completed_at']) + dt.timedelta(seconds=2)
          log = api(f'actions/jobs/{JOB}/logs').decode('utf-8', errors='replace')
          rows = []
          for line in log.splitlines():
              timestamp = re.match(r'^(\d{4}-\d\d-\d\dT[0-9:.]+Z)', line)
              if timestamp and start <= instant(timestamp.group(1)) <= end:
                  rows.append(line)
          def redact(line):
              if re.search(r'(?:token|password|private.?key|secret|Authorization)\s*[:=]', line, re.I):
                  return '[credential-shaped line omitted]'
              line = re.sub(r'https?://\S+', '[URL]', line)
              line = re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b', '[IP]', line)
              line = re.sub(r'\b[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}\b', '[UUID]', line)
              line = re.sub(r'[A-Za-z0-9_+/=-]{28,}', '[opaque value]', line)
              return line[-700:]
          def notice(title, text):
              text = redact(text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=' + title + '::' + text)
          notice('Source identity', f'run={RUN}; job={JOB}; SHA={SHA}')
          notice('Failed source step', step['name'])
          patterns = r'error|panic|cannot|could not|unable|failed|failure|fail:|not found|no such file|exit code|timed out|permission denied|segmentation|not enough|no space'
          hits = [i for i, line in enumerate(rows) if re.search(patterns, line, re.I)]
          selected = sorted({j for i in hits[-20:] for j in range(max(0,i-1),min(len(rows),i+2))})[-55:]
          for i in selected:
              notice('Redacted failure evidence', rows[i])
          case_count = sum(bool(re.search(r'=== case [A-Za-z0-9_-]+', line)) for line in rows)
          notice('Diagnostic limits', f'Printed {len(selected)} redacted lines from the failed-step interval; observed case-start markers={case_count}. No full log printed. No test rerun performed.')
          if not selected:
              notice('No proven cause', 'No error evidence extracted; owner must inspect the original log. Do not infer an infrastructure cause.')
          PY
