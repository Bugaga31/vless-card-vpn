name: E2E (Xray chain on emulator)
on:
  push:
    branches: ['rebuild-*', 'release-*', '!release-build-*', 'fix/auto-deferred-fallback-149', 'fix/auto-search-controls-150']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [33, 29]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore native libraries (validated before use)
        uses: actions/cache@v4
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Prepare isolated MTProto/media fixture (debug APK only; no public-service claim)
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 tools/e2e/test_service_fixture.py
          python3 tools/e2e/test_validate_probe.py
          python3 tools/e2e/service_fixture.py prepare /tmp/e2e-service
      - name: Build (all ABIs, debug) + JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :vpn-test-probe:assembleDebug
      - name: Xray-core for the host-side servers
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-linux-64.zip
          mkdir -p /tmp/xray && unzip -qo /tmp/xray.zip -d /tmp/xray && /tmp/xray/xray version | head -1
      - name: Verify full Reality chain reaches isolated protocol/media origin
        run: python3 tools/e2e/service_fixture_smoke.py /tmp/xray/xray /tmp/e2e-service
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: E2E_SERVICE_FIXTURE=/tmp/e2e-service bash tools/e2e-android.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-${{ matrix.api }}
          path: |
            /tmp/e2e/logcat.txt
            /tmp/e2e/server.log
            /tmp/e2e/access.log
            /tmp/e2e/case-*.log
            /tmp/e2e/case-*.xml
            /tmp/e2e/case-*-probe.json
            /tmp/e2e/service-fixture.log
            /tmp/e2e/warp-registration.log
            /tmp/e2e/warp-initial-probe.json
          if-no-files-found: ignore
  masks-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore native libraries (validated before use)
        uses: actions/cache@v4
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Validate matrix fixture guardrails
        run: python3 tools/e2e/test_matrix_fixture.py
      - name: Every server type × every mask through real Xray-core
        run: bash tools/masks-matrix-ci.sh
      - name: Upload matrix diagnostics (no account configurations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masks-matrix-diagnostics
          path: |
            /tmp/xcfg/result.txt
            /tmp/xcfg/wg-result.txt
            /tmp/xcfg/wg-client.log
            /tmp/srv/server.log
            /tmp/matrix-origin.log
          if-no-files-found: ignore
