name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Regenerate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vless-card-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/heads/main')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v1.0.${{ github.run_number }}
      run: |
        cat << 'EOF' > /tmp/release_notes.md
        ### 🚀 Что нового в этом релизе:

        - **🔋 Энергосбережение и разгрузка CPU:**
          - Включен **GSO (Generic Segmentation Offload)** на TUN-интерфейсе для пакетной обработки данных.
          - Интеллектуальный **Deep Sleep** режим: автоматическое замедление фоновых замеров и таймеров при выключенном экране (`ACTION_SCREEN_OFF`).

        - **⚡ Сетевые оптимизации (Zero RTT & Speed):**
          - **TCP Fast Open** на исходящих соединениях.
          - Локальный in-core DNS-кэш на 4096 записей с мгновенным откликом (0 мс).
          - Мгновенный сброс QUIC/UDP 443 для предотвращения зависаний YouTube.
          - Прямой роутинг (Direct) для ресурсов РФ (`.ru`, `.su`, банки, Госуслуги).

        - **🛠️ Критические исправления (Fixes Pass):**
          - Устранен взаимный Deadlock в `VlessVpnService` при подключении/отключении.
          - Исправлен синтаксис конфигурации Hysteria2 в SingBox.
          - Исправлены парсеры VLESS/Trojan/Shadowsocks URI (IPv6 хосты, URL decode, спецификация VLESS).
          - Реализован реальный Per-app Bypass через исключение пакетов в `VpnService`.
          - Потокобезопасный `AppDatabase` синглтон для предотвращения утечек ресурсов.
        EOF

        gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
          --title "VLESS Card VPN $TAG (Performance & Correctness Fixes)" \
          --notes-file /tmp/release_notes.md \
          --latest \
          --clobber || \
        gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
