name: Read bounded Auto 140 diagnostics
on:
  push:
    branches: [diagnose-auto140]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the failed E2E jobs and publish bounded relevant lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for JOB in 117750671919 117750672120; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB/logs" > "/tmp/$JOB.log"
          done
          python3 - <<'PY'
          import pathlib,re
          for job in ['117750671919','117750672120']:
              lines=pathlib.Path('/tmp/'+job+'.log').read_text(errors='replace').splitlines()
              hits=[i for i,line in enumerate(lines) if any(s in line for s in ['services: through','=== case services','=== case auto-eight','eight:','optimize:','services=[' ])]
              selected=sorted(set(j for i in hits for j in range(max(0,i-1),min(len(lines),i+3))))
              text=' | '.join(lines[i] for i in selected)[-18000:]
              # Only synthetic E2E/test output, no environment dumps or arbitrary repository files.
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=E2E-'+job+'::'+text)
          PY
