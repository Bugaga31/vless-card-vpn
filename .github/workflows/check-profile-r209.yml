name: Selectable Auto checks r209
on:
  push:
    branches: ['integration/check-profile-r209']
    paths-ignore: ['docs/validation/**']
permissions:
  contents: read
concurrency:
  group: auto-validation-r209
  cancel-in-progress: true
jobs:
  jvm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Apply reviewed compact source patch
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          base64 -d tools/patches/check-profile-r209.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/check-profile-r209.patch"
          echo '225218735e3b9353a34c44dbc7a570aa46fb2e5f7c79dd386f43ace56ed45baa  '"$RUNNER_TEMP/check-profile-r209.patch" | sha256sum -c -
          git fetch --quiet --no-tags origin 4166bc2957050caed3cb3583ba9879720def3c37
          git restore --source 4166bc2957050caed3cb3583ba9879720def3c37 -- app/src/main app/src/test app/build.gradle.kts
          git apply --check "$RUNNER_TEMP/check-profile-r209.patch"
          git apply "$RUNNER_TEMP/check-profile-r209.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if ! git diff --cached --quiet; then
            git commit -m 'fix(auto): apply latency stability policy [skip ci]'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/check-profile-r209
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Python and native loopback regressions
        id: host
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s tools/e2e -p 'test_*.py'
          python3 -m unittest discover -s tools/release-gates -p 'test_*.py'
          bash tools/run-byedpi-host-check.sh
      - name: Execute debug and release JVM tests
        id: jvm
        continue-on-error: true
        env: {GITHUB_RUN_NUMBER: '209'}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --continue --no-daemon --max-workers=2 :app:testDebugUnitTest :app:testReleaseUnitTest :vpn-test-probe:testDebugUnitTest 2>&1 | tee /tmp/jvm-r209.log
      - name: Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDebug
      - name: Summarize actual test results
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          JVM_OUTCOME: ${{ steps.jvm.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: python3 tools/ci/summarize-r209.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-r209
          path: |
            docs/validation/r209-jvm.json
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Publish scoped validation report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/check-profile-r209
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/r209-jvm.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record executed r206 regression results [skip ci]'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/check-profile-r209
          fi
      - name: Require passing checks
        if: always()
        run: python3 -c 'import json; d=json.load(open("docs/validation/r209-jvm.json")); assert all(v=="success" for v in d["steps"].values()), d["steps"]; assert not d["failures"] and not d["lint_errors"] and len(d["suites"])>=260; target=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.StabilityR206Test"]; assert len(target)==2 and all(int(s["tests"])==34 and int(s["failures"])==0 and int(s["errors"])==0 and int(s["skipped"])==0 for s in target), target'

      - name: Require voice and route stability regressions
        run: |
          python3 - <<'PYTEST'
          import json
          d=json.load(open("docs/validation/r209-jvm.json"))
          for name,count in {"com.vlesscardvpn.CallQualityR206Test":25,"com.vlesscardvpn.RouteStabilityR206Test":18}.items():
              suites=[s for s in d["suites"] if s["name"]==name]
              assert len(suites)==2 and all(int(s["tests"])==count and int(s["failures"])==0 and int(s["errors"])==0 and int(s["skipped"])==0 for s in suites),suites
          PYTEST

      - name: Require recovery regressions
        run: python3 -c 'import json; d=json.load(open("docs/validation/r209-jvm.json")); s=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.RecoveryR207Test"]; assert len(s)==2 and all(int(x["tests"])==30 and int(x["skipped"])==0 for x in s),s'

      - name: Require live evidence regressions
        run: python3 -c 'import json; d=json.load(open("docs/validation/r209-jvm.json")); s=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.core.ModuleEvidenceR208Test"]; assert len(s)==2 and all(int(x["tests"])==10 and int(x["failures"])==0 and int(x["errors"])==0 and int(x["skipped"])==0 for x in s),s'

      - name: Require mandatory bridge regressions
        run: python3 -c 'import json; d=json.load(open("docs/validation/r209-jvm.json")); s=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.tor.MandatoryBridgesR208Test"]; assert len(s)==2 and all(int(x["tests"])==14 and int(x["failures"])==0 and int(x["errors"])==0 and int(x["skipped"])==0 for x in s),s'

      - name: Require selected-check regressions
        run: python3 -c 'import json; d=json.load(open("docs/validation/r209-jvm.json")); s=[s for s in d["suites"] if s["name"]=="com.vlesscardvpn.core.AutoCheckProfileR209Test"]; assert len(s)==2 and all(int(x["tests"])==44 and int(x["failures"])==0 and int(x["errors"])==0 and int(x["skipped"])==0 for x in s),s'
