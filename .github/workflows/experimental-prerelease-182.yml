name: Experimental prerelease 1.2.71 (functional checks skipped)
on:
  push:
    branches: ['experiment/prerelease-182']
permissions:
  contents: read
env:
  VERSION: beta-build-182
concurrency:
  group: experimental-prerelease-182
  cancel-in-progress: true
jobs:
  apply-source:
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-182'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Commit the reviewed source patch on this experimental branch only
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/prerelease-182
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git apply --reverse --check tools/patches/adaptive-auto-r182.patch 2>/dev/null; then
            git apply --index tools/patches/adaptive-auto-r182.patch
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(auto): adaptive candidate priority, bounded reserve budget and foreground probe arbitration'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/experiment/prerelease-182
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: apply-source
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-182'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ needs.apply-source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Restore native libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Compile release APKs only
        run: |
          export GITHUB_RUN_NUMBER=182
          chmod +x gradlew
          ./gradlew -PbetaPreview=true -PemulatorAbis=true -PsplitAbi=true --no-daemon --max-workers=2 :app:assembleRelease
      - name: Sign with persistent Beta key
        env:
          KS_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
          KSP: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f beta.jks aligned.apk release/*.idsig' EXIT INT TERM
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "$KS_B64" | base64 -d > beta.jks
          mkdir -p release
          OUT=app/build/outputs/apk/release
          sign() {
            $BT/zipalign -f -p 4 "$1" aligned.apk
            $BT/apksigner sign --ks beta.jks --ks-key-alias beta --ks-pass env:KSP --key-pass env:KSP \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 21 --out "$2" aligned.apk
          }
          sign "$OUT/app-universal-release-unsigned.apk" release/VLESS-Card-Beta.apk
          sign "$OUT/app-arm64-v8a-release-unsigned.apk" release/VLESS-Card-Beta-arm64.apk
          rm -f beta.jks aligned.apk release/*.idsig
      - name: Verify signed package integrity only
        run: python3 tools/release-gates/prepare_experimental_182.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-apk
          path: release/
  publish-experimental:
    needs: [apply-source, build]
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-182'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-apk
          path: release
      - name: Publish experimental prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.apply-source.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/prerelease-182" --jq .object.sha)
          test "$CURRENT" = "$CANDIDATE_SHA" || { echo 'Candidate branch moved; publication stopped'; exit 1; }
          gh release create beta-v1.2.71-experimental \
            release/VLESS-Card-Beta-1.2.71-experimental.apk \
            release/VLESS-Card-Beta-1.2.71-experimental-arm64.apk \
            release/SHA256SUMS-Beta.txt release/verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --prerelease --latest=false --title 'VLESS Card 1.2.71 · Experimental' \
            --notes-file release/notes-experimental.md
