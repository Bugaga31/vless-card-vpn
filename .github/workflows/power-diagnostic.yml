name: Read bounded build failure diagnostics
on:
  push:
    branches: ['diagnose-power-128']
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract compiler and native validation failures only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/38574448644/logs" > /tmp/logs.zip
          python3 - <<'PY'
          import zipfile,re,json,pathlib,base64
          rows=[]
          for name in zipfile.ZipFile('/tmp/logs.zip').namelist():
              if 'JVM tests and debug build' not in name:continue
              text=zipfile.ZipFile('/tmp/logs.zip').read(name).decode(errors='replace')
              for line in text.splitlines():
                  if re.search(r'^.* > |native-cache|same path|\.json|not a directory|Native output validation failed|FileNotFoundError|Permission denied|Could not resolve|FAILED|Execution failed for task|Process .+exit|error:| e: |Caused by:|tests completed|Traceback|ValueError|KeyError|NotADirectoryError',line):
                      line=re.sub(r'https?://\S+','[URL]',line)
                      if re.search(r'token|password|secret|authorization|private.key',line,re.I):continue
                      rows.append(line[:500])
          data=('\n'.join(rows[-40:]) or 'No matching failure lines').encode()
          pathlib.Path('/tmp/diagnostic.json').write_text(json.dumps({'message':'ci: record bounded compiler/native failure diagnostics','branch':'diagnose-power-128','content':base64.b64encode(data).decode()}))
          print('Bounded diagnostic lines:',len(rows))
          PY
          gh api --method PUT "repos/$GH_REPO/contents/ci/power-build-detail.txt" --input /tmp/diagnostic.json --jq .commit.sha
