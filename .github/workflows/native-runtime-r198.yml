name: Native Auto attempt accounting and UI validation r198
on:
  push:
    branches: ['integration/network-device-r198']
    paths-ignore: ['docs/validation/**']
concurrency:
  group: native-network-r198
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Apply the same reviewed laboratory source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          base64 -d tools/patches/network-r198.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/network-r198.patch"
          echo 'e84faa0378ca9535c36057aaff4b9570f1c57971275ce593b1ea76f2dbb21141  '"$RUNNER_TEMP/network-r198.patch" | sha256sum -c -
          git fetch --quiet --no-tags origin 0fe8abd672580077b3ad431dbafda798bb11dbfa
          git restore --source 0fe8abd672580077b3ad431dbafda798bb11dbfa -- app/src/main app/src/test app/build.gradle.kts
          PATCH="$RUNNER_TEMP/network-r198.patch"
          if ! git apply --reverse --check "$PATCH" 2>/dev/null; then
            git apply --check "$PATCH"
            git apply "$PATCH"
          fi
          test -f app/src/androidTest/java/com/vlesscardvpn/ProductRuntimeR190Test.kt
          python3 -c "import base64;exec(base64.b64decode(''))"
          find app/src/androidTest -name '*.kt' -exec sed -i 's/ui197/ui198/g' {} +
          sed -i 's/WaitReason.BACKOFF,30000/WaitReason.BACKOFF,5000/g' app/src/androidTest/java/com/vlesscardvpn/DashboardUiR190Test.kt
          python3 -c "import base64,gzip,json,pathlib;[(pathlib.Path(x['path']).write_text(x['content'])) for x in json.loads(gzip.decompress(base64.b64decode(pathlib.Path('tools/patches/harness-r198.json.gz.b64').read_text())))]"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if ! git diff --cached --quiet; then
          git commit -m 'fix(auto): apply bounded session source to runtime harness [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/network-device-r198
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Build instrumented debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare authenticated loopback backend
        run: |
          curl -fL --retry 2 -o backend.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  backend.tar.gz' | sha256sum -c -
          tar xzf backend.tar.gz
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run controlled native Android checks
        id: native
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/ci/run-runtime-r198.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-runtime-r198
          path: |
            docs/validation/r198-device.json
            runtime-results-r198.txt
            runtime-r198.log
            fixture-r198.log
            runtime-r198.png
            docs/validation/r198-ui/
      - name: Publish actual controlled runtime result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', NATIVE_OUTCOME: '${{ steps.native.outcome }}'}
        run: |
          set -euo pipefail
          if ! test -f docs/validation/r198-device.json; then
            mkdir -p docs/validation
            python3 -c 'import os,json;json.dump({"source_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"native_outcome":os.environ["NATIVE_OUTCOME"],"runtime_tests_executed":False},open("docs/validation/r198-device.json","w"))'
          fi
          test "$GITHUB_REF" = refs/heads/integration/network-device-r198
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/r198-device.json
          if test -d docs/validation/r198-ui; then git add docs/validation/r198-ui; fi
          git commit -m 'docs: record controlled Android checks [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/integration/network-device-r198
      - name: Require runtime assertions
        if: always()
        run: python3 -c 'import json;d=json.load(open("docs/validation/r198-device.json"));assert d.get("passed") is True and d.get("ui_captures_executed") is True and len(d.get("screenshots",[]))==31,d'
