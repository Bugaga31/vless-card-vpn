name: Transfer verified 1.2.123 APKs to approved draft
on:
  push:
    branches: ['release/publish-1.2.123']
    paths: ['.github/workflows/transfer-verified-123.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/release/publish-1.2.123'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 2f9575215f3ef61270902926c68a7af6f1154231
      RELEASE_ID: '431334475'
    steps:
      - name: Verify the completed exact-source CI and draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41420526068" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41420526068/jobs?per_page=100" > jobs.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('run.json')); jobs=json.load(open('jobs.json'))['jobs']; d=json.load(open('draft.json'))
          assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']==os.environ['EXPECTED_SHA']
          wanted={'source','build','masks-matrix','e2e (29)','e2e (33)','emulator-install (30, google_apis)','emulator-install (34, google_apis)'}
          assert wanted=={j['name'] for j in jobs}, [j['name'] for j in jobs]
          assert all(j['conclusion']=='success' for j in jobs)
          assert d['draft'] is True and d['prerelease'] is False and d['tag_name']=='v1.2.123'
          assert d['target_commitish']==os.environ['EXPECTED_SHA'], d['target_commitish']
          print('CI and existing draft verified')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-apk
          path: release
          run-id: 41420526068
          github-token: ${{ github.token }}
      - name: Verify signed APK metadata and bytes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          python3 - <<'PY'
          import json,hashlib,zipfile,os,shutil
          d=json.load(open('verification.json'))
          assert d['candidate_sha']==os.environ['EXPECTED_SHA'] and str(d['run_id'])=='41420526068'
          expected={'VLESS-Card-Beta-arm64.apk':('VLESS-Card-1.2.123-arm64.apk','77bf7296a853fdd2f9feef2c129ba4fe93d895df27e97a6c3bc272216469059c',41820515),'VLESS-Card-Beta.apk':('VLESS-Card-1.2.123.apk','1e499302caf200d41193cbc88d2a451d73522b16decfc3c744e0c508921c39a7',106976806)}
          assert {a['file'] for a in d['apks']}==set(expected)
          for a in d['apks']:
              old=a['file'];new,h,n=expected[old]
              assert a['sha256']==h and a['certificate_sha256']=='3b9f1771645de07cb01b2303a868363e97cfa8d3ca4d6079dae307066f4f1e6b'
              assert "name='com.vlesscardvpn.beta2'" in a['package'] and "versionCode='234'" in a['package'] and "versionName='1.2.123'" in a['package']
              assert os.path.getsize(old)==n and hashlib.sha256(open(old,'rb').read()).hexdigest()==h
              with zipfile.ZipFile(old) as z: assert z.testzip() is None
              shutil.copyfile(old,new)
          shutil.copyfile('verification.json','build-verification.json')
          with open('SHA256SUMS.txt','w') as f:
              for new,h,n in expected.values():f.write(h+'  '+new+'\n')
          print('Frozen APKs and certificates verified')
          PY
      - name: Upload verified files to draft only
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for file in VLESS-Card-1.2.123-arm64.apk VLESS-Card-1.2.123.apk build-verification.json SHA256SUMS.txt; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > ../assets.json
            FILE="$file" python3 - <<'PY'
          import os,json,hashlib
          name=os.environ['FILE']; assets=json.load(open('../assets.json'));matches=[a for a in assets if a['name']==name]
          assert len(matches)<=1
          if matches:
              a=matches[0];digest='sha256:'+hashlib.sha256(open(name,'rb').read()).hexdigest()
              assert a['state']=='uploaded' and a['size']==os.path.getsize(name) and a.get('digest')==digest, 'Existing asset differs; no overwrite'
              print('Existing verified asset:',name)
          open('../upload-needed','w').write('no' if matches else 'yes')
          PY
            if [ "$(cat ../upload-needed)" = yes ]; then
              gh api --method POST -H 'Content-Type: application/octet-stream' --input "$file" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" --silent
              echo "Uploaded $file"
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > ../after.json
          python3 - <<'PY'
          import json,hashlib,os
          d=json.load(open('../after.json')); assert d['draft'] is True and d['tag_name']=='v1.2.123' and d['target_commitish']==os.environ['EXPECTED_SHA']
          for n in ['VLESS-Card-1.2.123-arm64.apk','VLESS-Card-1.2.123.apk','build-verification.json','SHA256SUMS.txt']:
              a=[x for x in d['assets'] if x['name']==n];assert len(a)==1 and a[0]['state']=='uploaded' and a[0]['size']==os.path.getsize(n) and a[0].get('digest')=='sha256:'+hashlib.sha256(open(n,'rb').read()).hexdigest(),n
          print('All four draft files independently verified. Publication remains manual.')
          PY
