name: Quiet checks and automatic Watson R228 (verification only)
on:
  push:
    branches: ['experiment/watson-quiet-r228']
permissions:
  contents: read
concurrency:
  group: watson-quiet-r228
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: source
        shell: python
        run: |
          import base64,gzip,json,pathlib,subprocess,os,hashlib
          assert os.environ['GITHUB_REF']=='refs/heads/experiment/watson-quiet-r228'
          subprocess.run(['git','merge-base','--is-ancestor','338a6d0b34155ce2109c235b06dcb987b91dcea7','HEAD'],check=True)
          p=json.loads(gzip.decompress(base64.b64decode('')))
          if not all(pathlib.Path(n).exists() and pathlib.Path(n).read_text()==c for n,c in p['files'].items()):
              for n,want in p['base'].items():
                  f=pathlib.Path(n)
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==want, 'Concurrent source change: '+n
              for n,c in p['files'].items():
                  f=pathlib.Path(n);f.parent.mkdir(parents=True,exist_ok=True);f.write_text(c)
              subprocess.run(['git','add',*p['files']],check=True)
              subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: quiet service checks, automatic Watson and recovery alerts [skip ci]'],check=True)
              subprocess.run(['git','push','origin','HEAD:experiment/watson-quiet-r228'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+sha+'\n')
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Restore native libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Android compilation and targeted regressions
        run: |
          export GITHUB_RUN_NUMBER=228
          chmod +x gradlew
          ./gradlew -PbetaPreview=true -PemulatorAbis=true --no-daemon --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest --tests "*QuietWatsonR228Test" --tests "*ResponsiveAutoR227Test" --tests "*LatencyMigrationR227Test" --tests "*AutomaticWorkR226Test" --tests "*YouTubeAccessR226Test" --tests "*YouTubeLoadingR226Test" --tests "*TpwsProfileR226Test" --tests "*HomeDataMapperTest" --tests "*HomeRuntimeTest" --tests "*HomeUiWiringTest" --tests "*AutoRecoveryR224Test" --tests "*RecoveryR207Test" --tests "*ServiceExpansionR223Test" --tests "*AutoProfileR223Test" --tests "*ByeDpiArgsTest" --tests "*SeriesDiagnosticsR222Test" --tests "*ServiceTransportR221Test" --tests "*ProbeConfigR221Test" --tests "*CallQualityR206Test" --tests "*UdpCallProbeR174Test" --tests "*ServiceErrorsR220Test" --tests "*UiReadabilityR220Test" --tests "*AssistantIsolationR220Test" --tests "*R84Test" --tests "*R85Test" --tests "*FirstConnectivityR219Test" --tests "*AutoFreshR218Test" --tests "*WatsonAutoR217Test" --tests "*ServiceMediaR217Test" --tests "*FlyRokiR216Test" --tests "*AutoRokiR216Test" --tests "*WatsonR215Test" --tests "*RequiredServicesR214Test" --tests "*TelegramSocksProbeTest" --tests "*ServiceMediaProbeTest" --tests "*ExperienceR187Test" --tests "*TorBridgeCatalogR163Test" --tests "*MandatoryBridgesR208Test" --tests "*FoundPresetR213Test" --tests "*FoundConnectR213Test" --tests "*FoundRouteR212Test" --tests "*RouteStabilityR206Test" --tests "*FastConnectR211Test" --tests "*ProbeConcurrencyR210Test" --tests "*SearchPacingR200Test" --tests "*SubscriptionQueueR199Test" --tests "*AutoLatencyR185Test" --tests "*AutoCampaignR175Test" --tests "*ForegroundAutoR176Test" --tests "*PoolLatencyR203Test" --tests "*PhoneRuntimePolicyTest" --tests "*PowerRoutingR192Test" --tests "*AutoCheckProfileR209Test" --tests "*PowerPolicy*"
      - name: Save test reports (not an APK release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r228-targeted-test-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
