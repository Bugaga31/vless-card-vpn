name: Experimental prerelease 1.2.97 (gated scoped checks)
on:
  push:
    branches: ['experiment/prerelease-208-release']
permissions:
  contents: read
env:
  VERSION: beta-build-208
concurrency:
  group: experimental-prerelease-208
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/prerelease-208-release
          base64 -d tools/patches/telegram-evidence-r208.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/r208.patch"
          echo '7f1357410dcfe2561243086ef0abc0c3aa2a859bdb89e623ee216d074a3b4705  '"$RUNNER_TEMP/r208.patch" | sha256sum -c -
          git fetch --quiet --no-tags origin b14d3987d7cb9f4a59a4527413cae0e3fc97e6cc
          git restore --source b14d3987d7cb9f4a59a4527413cae0e3fc97e6cc -- app/src/main app/src/test app/build.gradle.kts
          git apply --check "$RUNNER_TEMP/r208.patch"
          git apply "$RUNNER_TEMP/r208.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if ! git diff --cached --quiet; then
            git commit -m 'fix(tor): pin final guarded source for experimental 208 [skip ci]'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/experiment/prerelease-208-release
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-208-release'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Restore native libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Compile gated release APKs
        run: |
          export GITHUB_RUN_NUMBER=208
          chmod +x gradlew
          ./gradlew -PbetaPreview=true -PemulatorAbis=true -PsplitAbi=true --no-daemon --max-workers=2 :app:assembleRelease
      - name: Require actual successful matching JVM and Android results
        run: python3 tools/release-gates/gate_experimental_208.py
      - name: Sign with persistent Beta key
        env:
          KS_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
          KSP: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f beta.jks aligned.apk release/*.idsig' EXIT INT TERM
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "$KS_B64" | base64 -d > beta.jks
          mkdir -p release
          OUT=app/build/outputs/apk/release
          sign() {
            $BT/zipalign -f -p 4 "$1" aligned.apk
            $BT/apksigner sign --ks beta.jks --ks-key-alias beta --ks-pass env:KSP --key-pass env:KSP \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 21 --out "$2" aligned.apk
          }
          sign "$OUT/app-universal-release-unsigned.apk" release/VLESS-Card-Beta.apk
          sign "$OUT/app-arm64-v8a-release-unsigned.apk" release/VLESS-Card-Beta-arm64.apk
          rm -f beta.jks aligned.apk release/*.idsig
      - name: Verify persistent signature and signed package integrity
        run: python3 tools/release-gates/prepare_experimental_208.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-apk
          path: release/
  publish-experimental:
    needs: [source, build]
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-208-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-apk
          path: release
      - name: Publish experimental prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/prerelease-208-release" --jq .object.sha)
          test "$CURRENT" = "$CANDIDATE_SHA" || { echo 'Candidate branch moved; publication stopped'; exit 1; }
          gh release create beta-v1.2.97-experimental \
            release/VLESS-Card-Beta-1.2.97-experimental.apk \
            release/VLESS-Card-Beta-1.2.97-experimental-arm64.apk \
            release/SHA256SUMS-Beta.txt release/verification.json \
            release/validation-jvm.json release/validation-device.json release/validation-ui-review.json \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --prerelease --latest=false --title 'VLESS Card 1.2.97 · Experimental' \
            --notes-file release/notes-experimental.md

# Publication still requires exact-source runtime results and captured UI visual review.
