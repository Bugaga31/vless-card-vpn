name: Experimental prerelease 1.2.98 (UNVALIDATED owner-requested)
on:
  push:
    branches: ['experiment/prerelease-209-release']
permissions:
  contents: read
env:
  VERSION: beta-build-209
concurrency:
  group: experimental-prerelease-209
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/prerelease-209-release
          # Build the already materialized selectable-profile source; do not restore or patch it again.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-209-release'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Restore native libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/build/generated/byedpi
            app/build/generated/hev
            app/build/generated/byedpi-cache.json
            app/build/generated/hev-cache.json
          key: native-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-api24-all-${{ hashFiles('native/**', 'app/build.gradle.kts') }}
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Compile release APKs (functional checks intentionally skipped)
        run: |
          export GITHUB_RUN_NUMBER=209
          chmod +x gradlew
          ./gradlew -PbetaPreview=true -PemulatorAbis=true -PsplitAbi=true --no-daemon --max-workers=2 :app:assembleRelease
      - name: Sign with persistent Beta key
        env:
          KS_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
          KSP: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f beta.jks aligned.apk release/*.idsig' EXIT INT TERM
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "$KS_B64" | base64 -d > beta.jks
          mkdir -p release
          OUT=app/build/outputs/apk/release
          sign() {
            $BT/zipalign -f -p 4 "$1" aligned.apk
            $BT/apksigner sign --ks beta.jks --ks-key-alias beta --ks-pass env:KSP --key-pass env:KSP \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 21 --out "$2" aligned.apk
          }
          sign "$OUT/app-universal-release-unsigned.apk" release/VLESS-Card-Beta.apk
          sign "$OUT/app-arm64-v8a-release-unsigned.apk" release/VLESS-Card-Beta-arm64.apk
          rm -f beta.jks aligned.apk release/*.idsig
      - name: Verify persistent signature and signed package integrity
        shell: bash
        run: |
          set -o pipefail
          python3 tools/release-gates/prepare_unvalidated_209.py 2>&1 | tee "$RUNNER_TEMP/package-check.log" || {
            python3 -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"package-check.log").read_text()[-5000:]; print("::error title=Package integrity check failed::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-apk
          path: release/
  publish-experimental:
    needs: [source, build]
    if: github.repository == 'Bugaga31/vless-card-vpn' && github.ref == 'refs/heads/experiment/prerelease-209-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-apk
          path: release
      - name: Publish experimental prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/prerelease-209-release" --jq .object.sha)
          test "$CURRENT" = "$CANDIDATE_SHA" || { echo 'Candidate branch moved; publication stopped'; exit 1; }
          gh release create beta-v1.2.98-experimental \
            release/VLESS-Card-Beta-1.2.98-experimental.apk \
            release/VLESS-Card-Beta-1.2.98-experimental-arm64.apk \
            release/SHA256SUMS-Beta.txt release/verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --prerelease --latest=false --title 'VLESS Card 1.2.98 · Experimental — НЕ ПРОВЕРЕНО' \
            --notes-file release/notes-experimental.md

# Owner explicitly requested an unvalidated experimental prerelease; signature/package checks remain mandatory.
