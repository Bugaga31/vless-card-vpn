name: Cloud server check
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/cloud_servers.py', 'scripts/cloud_reports.py', 'scripts/cloud_real.py', '.github/workflows/cloud-servers.yml']
permissions:
  contents: write
  actions: write  # the run starts the next one itself: GitHub's cron here did not fire at all
concurrency: { group: cloud-servers, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Validate cloud-learning policies
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_cloud_learning.py'
      - name: Collect and ping
        run: mkdir -p out && python3 scripts/cloud_servers.py
      - name: Real check through Xray (HTTPS through every top server)
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-linux-64.zip
          mkdir -p /tmp/xray && unzip -qo /tmp/xray.zip -d /tmp/xray
          XRAY=/tmp/xray/xray python3 scripts/cloud_real.py || echo "::warning::real check failed, ping order kept"
      - name: Merge phone reports (shared cloud)
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python3 scripts/cloud_reports.py || echo "::warning::reports merge failed"
      - name: Publish to the «servers» branch
        run: |
          cd out
          git init -q -b servers
          git config user.name "cloud-check"; git config user.email "cloud-check@users.noreply.github.com"
          git add -A && git commit -qm "cloud check $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" servers
      - name: Start the next run in 10 minutes
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 600 - ( $(date +%s) - START ) )); [ $left -gt 0 ] && sleep $left
          gh workflow run cloud-servers.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::could not schedule the next run"
