name: Xray Release
on:
  push:
    branches: [feat/xray-test, main]
    tags:
      - 'v*'
      - 'xray-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare native sources and license assets
        env:
          GOTOOLCHAIN: local
        run: python3 xray-test/release/prepare.py prepare

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permissions
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APK
        run: ./gradlew :xray-test:testDebugUnitTest :xray-test:assembleDebug --stacktrace

      - name: Package Release Assets
        run: |
          python3 xray-test/release/prepare.py bundle
          mkdir -p release
          cp xray-test/build/outputs/apk/debug/xray-test-debug.apk release/VLESS-Card-Xray.apk
          cd release
          sha256sum VLESS-Card-Xray.apk *.zip > SHA256SUMS.txt

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-unit-results
          path: xray-test/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLESS-Card-Xray-APK
          path: release/VLESS-Card-Xray.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xray-v1.1.${{ github.run_number }}
          name: 'VLESS Card VPN (Xray Core) v1.1.${{ github.run_number }}'
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: xray-test/release/RELEASE_NOTES.md
          files: |
            release/VLESS-Card-Xray.apk
            release/VLESS-Card-Test-Xray-sources.zip
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
