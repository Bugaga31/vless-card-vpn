name: Android 13 Stability Preview

on:
  push:
    branches: [fix/android-stability-stable-tls-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Prepare Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build preview and check unit tests/lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PstabilityPreview=true --stacktrace --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android 13 startup, UI and native-schema tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: bash ci/android-stability-qa.sh
      - name: Upload test reports and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-test-reports-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/lint-results-debug.*
            release/screenshots/
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/VLESS-Card-Test.apk
          cd release
          sha256sum VLESS-Card-Test.apk > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'NOTES'
          ## Тестовая сборка для проверки вылетов при запуске
          Устанавливается рядом как **VLESS Card VPN · Test** (`com.vlesscardvpn.preview`), не удаляет данные основной версии. Свои серверы при необходимости импортируются отдельно.
          - Нативное ядро не загружается при открытии приложения.
          - Сохранённый автоматический выбор сервера больше не запускает VPN сам при открытии.
          - Исправлена очистка ресурсов службы и пересечение запросов VPN-разрешения.
          - Новый главный экран и профиль «Стабильный TLS» без случайной подмены SNI.
          Публикация проходит только после unit tests, Android lint и instrumentation tests на Android 13. Реальный realme и обход блокировок у конкретного провайдера этой проверкой не подтверждаются.
          Ядро sing-box сохранено. Xray, Orbot, ByeDPI и zapret не встроены в этот релиз.
          Это debug-подпись; обновление уже установленной тестовой версии требует совпадения подписи. Не удаляйте приложение с нужными данными без экспорта конфигураций.
          NOTES
      - uses: actions/upload-artifact@v4
        with:
          name: stability-release-assets
          path: |
            release/VLESS-Card-Test.apk
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error

  publish-preview:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stability-release-assets
          path: release
      - name: Publish prerelease (does not replace stable release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: stability-preview-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/VLESS-Card-Test.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/VLESS-Card-Test.apk release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease --latest=false \
              --title "VLESS Card VPN · Test (Android 13) #${GITHUB_RUN_NUMBER}" \
              --notes-file release/RELEASE_NOTES.md
          fi
